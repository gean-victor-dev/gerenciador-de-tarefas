<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizaê - Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Organize-se 📝</h1>
        
        <!-- Formulário para adicionar tarefa -->
        <form id="task-form">
            <input type="text" id="task-input" placeholder="O que você precisa fazer?" required>
            <button type="submit">Adicionar</button>
        </form>

        <!-- Filtros e Contadores -->
        <div class="controls">
            <div class="filters">
                <button class="filter-btn active" data-filter="all">Todas</button>
                <button class="filter-btn" data-filter="pending">Pendentes</button>
                <button class="filter-btn" data-filter="completed">Concluídas</button>
            </div>
            <span id="task-count">0 tarefas pendentes</span>
        </div>

        <!-- Lista de Tarefas -->
        <ul id="task-list"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
